services:
    gateway:
        build: .
        ports:
            - "127.0.0.1:${GATEWAY_PORT:-8787}:8787"
        env_file: .env
        environment:
            GATEWAY_HOST: 0.0.0.0
            GATEWAY_PORT: 8787
            GATEWAY_DATA_DIR: /app/.output/gateway
        volumes:
            - gateway-data:/app/.output/gateway
        restart: unless-stopped
        stop_grace_period: 60s
        healthcheck:
            test: [
                "CMD",
                "deno",
                "eval",
                "const r = await fetch('http://127.0.0.1:8787/healthz'); if (!r.ok) Deno.exit(1);",
            ]
            interval: 30s
            timeout: 5s
            start_period: 20s
            retries: 3
volumes:
    gateway-data:
